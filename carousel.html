<!-- TJH Volunteer Carousel: paste into a WordPress "Custom HTML" block.
     Set FEED_URL below to your Apps Script web app URL. -->
<div id="tjh-vc" class="tjh-vc" aria-label="Our Volunteers">
  <button class="tjh-vc-btn tjh-vc-prev" aria-label="Previous">&#10094;</button>
  <div class="tjh-vc-viewport"><div class="tjh-vc-track"></div></div>
  <button class="tjh-vc-btn tjh-vc-next" aria-label="Next">&#10095;</button>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap">
<style>
.tjh-vc{--tjh-photo-size:150px;font-family:'Lato',sans-serif;position:relative;max-width:1100px;margin:0 auto;padding:0 44px;box-sizing:border-box}
.tjh-vc *{box-sizing:border-box}
.tjh-vc-viewport{overflow:hidden}
.tjh-vc-track{display:flex;transition:transform .5s ease}
.tjh-vc-slide{flex:0 0 25%;padding:0 12px;text-align:center}
.tjh-vc-slide img,.tjh-vc-ph{width:100%;max-width:var(--tjh-photo-size);margin:0 auto;aspect-ratio:1/1;object-fit:cover;border-radius:50%;background:#e5e7eb;display:block}
.tjh-vc-slide a{color:inherit;text-decoration:none;display:block}
.tjh-vc-name{margin-top:12px;font-size:25px;font-weight:700;line-height:1.3;color:#333333}
.tjh-vc-btn{position:absolute;top:40%;transform:translateY(-50%);background:none;border:0;font-size:24px;cursor:pointer;padding:8px;color:#54595F}
.tjh-vc-prev{left:0}.tjh-vc-next{right:0}
@media(max-width:900px){.tjh-vc-slide{flex-basis:50%}}
@media(max-width:480px){.tjh-vc-slide{flex-basis:100%}}
</style>

<script>
(function () {
  var FEED_URL = 'https://script.google.com/macros/s/AKfycbztDMUVcCqW9sIawJOx-gkfw4Dct8bcdiMPNDPS0gwJWr3IuEECaUYvlxTKALw9osmk/exec';
  var AUTOPLAY_MS = 1300;

  var root = document.getElementById('tjh-vc');
  var track = root.querySelector('.tjh-vc-track');
  var pos = 0, timer, items = [];

  function perView() {
    var w = window.innerWidth;
    return w <= 480 ? 1 : w <= 900 ? 2 : 4;
  }
  function maxPos() { return Math.max(0, items.length - perView()); }
  function render() {
    track.style.transform = 'translateX(' + (-pos * (100 / perView())) + '%)';
  }
  function go(d) {
    pos += d;
    if (pos > maxPos()) pos = 0;
    if (pos < 0) pos = maxPos();
    render();
  }
  function play() {
    clearInterval(timer);
    if (items.length > perView()) timer = setInterval(function () { go(1); }, AUTOPLAY_MS);
  }

  function build(list) {
    items = list;
    if (!items.length) { root.style.display = 'none'; return; }
    items.forEach(function (v) {
      var s = document.createElement('div');
      s.className = 'tjh-vc-slide';
      var img = v.photo ? document.createElement('img') : document.createElement('div');
      if (v.photo) {
        img.alt = v.name; img.loading = 'lazy';
        img.onerror = function () { // fall back to a placeholder if the photo fails to load
          var ph = document.createElement('div'); ph.className = 'tjh-vc-ph';
          if (img.parentNode) img.parentNode.replaceChild(ph, img);
        };
        img.src = v.photo;
      }
      else img.className = 'tjh-vc-ph';
      var n = document.createElement('div');
      n.className = 'tjh-vc-name';
      n.textContent = v.name; // textContent: safe against injected markup
      var box = s;
      if (v.linkedin) {
        box = document.createElement('a');
        box.href = v.linkedin; box.target = '_blank'; box.rel = 'noopener noreferrer';
        box.setAttribute('aria-label', v.name + ' on LinkedIn');
        s.appendChild(box);
      }
      box.appendChild(img); box.appendChild(n);
      track.appendChild(s);
    });
    var hide = items.length <= perView() ? 'none' : '';
    root.querySelector('.tjh-vc-prev').style.display = hide;
    root.querySelector('.tjh-vc-next').style.display = hide;
    render(); play();
  }

  root.querySelector('.tjh-vc-prev').onclick = function () { go(-1); play(); };
  root.querySelector('.tjh-vc-next').onclick = function () { go(1); play(); };
  root.onmouseenter = function () { clearInterval(timer); };
  root.onmouseleave = play;
  window.addEventListener('resize', function () { pos = Math.min(pos, maxPos()); render(); play(); });

  fetch(FEED_URL).then(function (r) { return r.json(); }).then(build)
    .catch(function () { root.style.display = 'none'; });
})();
</script>
